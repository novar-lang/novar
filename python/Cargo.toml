[package]
name = "telvax_py"
description = "Telvax: Python bindings (PyO3) with zero-copy Arrow and CUDA array interchange"
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/telvax/telvax"
rust-version = "1.88"
publish = false

# Built with maturin, on its own: the extension-module link flags do not suit `cargo test`
# of the main workspace, so this crate is excluded from it and keeps its own lockfile.
[workspace]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
arrow = { version = "59", default-features = false, features = ["ffi"] }
telvax_diagnostics = { path = "../compiler/diagnostics" }
telvax_hir = { path = "../compiler/semantic" }
telvax_parser = { path = "../compiler/parser" }
telvax_repl = { path = "../tools/repl" }
telvax_runtime = { path = "../runtime" }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py39"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
