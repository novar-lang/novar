[build-system]
requires = ["maturin>=1.15.0,<2"]
build-backend = "maturin"

[project]
name = "telvax"
version = "0.0.4"
description = "Python bindings for the Telvax language runtime"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }

[tool.maturin]
python-source = "python"
module-name = "telvax._native"
