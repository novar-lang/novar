[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "novar"
version = "0.1.0"
description = "Python bindings for the Novar language runtime"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }

[tool.maturin]
python-source = "python"
module-name = "novar._native"
