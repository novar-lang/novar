[package]
name = "novar_cli"
description = "Novar: novar_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "novar"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
novar_lint = { version = "0.0.2", path = "../tools/linter" }
novar_fmt = { version = "0.0.2", path = "../tools/formatter" }
novar_accel = { version = "0.0.2", path = "../compiler/accel" }
novar_codegen = { version = "0.0.2", path = "../compiler/codegen", optional = true }
novar_mlir = { version = "0.0.2", path = "../compiler/ir", optional = true }
axum = "0.8.9"
novar_diagnostics = { version = "0.0.2", path = "../compiler/diagnostics" }
novar_hir = { version = "0.0.2", path = "../compiler/semantic" }
novar_parser = { version = "0.0.2", path = "../compiler/parser" }
novar_runtime = { version = "0.0.2", path = "../runtime", default-features = false }
novar_server = { version = "0.0.2", path = "../server" }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "signal"] }
novar_lsp = { version = "0.0.2", path = "../tools/lsp" }
novar_pkg = { version = "0.0.2", path = "../tools/package-manager" }
novar_modules = { version = "0.0.2", path = "../compiler/modules" }
serde = { version = "1.0.229", features = ["derive"] }
novar_cluster = { version = "0.0.2", path = "../tools/cluster" }

[features]
default = ["tables", "live"]
# Tables, CSV / Parquet and SQL (Arrow + DataFusion). Leaving it out makes a much smaller binary.
tables = ["novar_runtime/tables"]
# Real Ollama / OpenAI / PostgreSQL backends (`--live`).
live = ["novar_runtime/live"]
# Run tensor operations on the GPU (`--device gpu`) through wgpu.
gpu = ["novar_runtime/gpu"]
# Native backend (MLIR + LLVM 22). Needs LLVM installed; see scripts/llvm-env.sh.
llvm = ["novar_accel/llvm", "dep:novar_codegen", "dep:novar_mlir", "novar_codegen/llvm", "novar_mlir/llvm"]

[dev-dependencies]
novar_pkg = { version = "0.0.2", path = "../tools/package-manager" }
serde_json = "1.0.154"
