[package]
name = "novar_cli"
description = "Novar: novar_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "novar"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
novar_codegen = { version = "0.1.0", path = "../compiler/codegen", optional = true }
novar_mlir = { version = "0.1.0", path = "../compiler/ir", optional = true }
axum = "0.8.9"
novar_diagnostics = { version = "0.1.0", path = "../compiler/diagnostics" }
novar_hir = { version = "0.1.0", path = "../compiler/semantic" }
novar_parser = { version = "0.1.0", path = "../compiler/parser" }
novar_runtime = { version = "0.1.0", path = "../runtime" }
novar_server = { version = "0.1.0", path = "../server" }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "macros", "signal"] }

[features]
# Native backend (MLIR + LLVM 22). Needs LLVM installed; see scripts/llvm-env.sh.
llvm = ["dep:novar_codegen", "dep:novar_mlir", "novar_codegen/llvm", "novar_mlir/llvm"]

[dev-dependencies]
serde_json = "1.0.154"
