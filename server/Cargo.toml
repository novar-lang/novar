[package]
name = "novar_server"
description = "Novar: novar_server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
novar_hir = { version = "0.0.1", path = "../compiler/semantic" }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["rt", "macros"] }

[dev-dependencies]
http-body-util = "0.1.5"
novar_parser = { version = "0.0.1", path = "../compiler/parser" }
tokio = { version = "1.53.2", features = ["rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
