[package]
name = "novar_runtime"
description = "Novar: novar_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["tables", "live"]
# Arrow tables with CSV / Parquet ingestion and SQL (DataFusion). Off for the Wasm playground.
# Real Ollama / OpenAI / pgvector backends (`novar serve --live`).
live = ["dep:ureq", "dep:postgres"]
tables = ["dep:datafusion", "dep:tokio", "dep:parquet"]

[dependencies]
arrow = { version = "59", default-features = false, features = ["csv"] }
datafusion = { version = "55.2.0", default-features = false, features = ["parquet", "sql", "math_expressions", "string_expressions", "datetime_expressions"], optional = true }
parquet = { version = "59", default-features = false, features = ["arrow"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
novar_hir = { version = "0.1.0", path = "../compiler/semantic" }
serde_json = "1.0.154"
ureq = { version = "3", features = ["json"], optional = true }
postgres = { version = "0.19", optional = true }

[dev-dependencies]
novar_parser = { version = "0.1.0", path = "../compiler/parser" }
