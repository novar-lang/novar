[package]
name = "telvax_wasm"
description = "Telvax: WebAssembly build of the compiler front end and interpreter for the web playground"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
telvax_diagnostics = { version = "0.0.4", path = "../compiler/diagnostics" }
telvax_hir = { version = "0.0.4", path = "../compiler/semantic" }
telvax_lsp = { version = "0.0.4", path = "../tools/lsp", default-features = false }
telvax_parser = { version = "0.0.4", path = "../compiler/parser" }
# No DataFusion or network clients in the browser.
telvax_runtime = { version = "0.0.4", path = "../runtime", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.129"
