[package]
name = "novar_wasm"
description = "Novar: WebAssembly build of the compiler front end and interpreter for the web playground"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
novar_diagnostics = { version = "0.1.0", path = "../compiler/diagnostics" }
novar_hir = { version = "0.1.0", path = "../compiler/semantic" }
novar_lsp = { version = "0.1.0", path = "../tools/lsp" }
novar_parser = { version = "0.1.0", path = "../compiler/parser" }
# No DataFusion or network clients in the browser.
novar_runtime = { version = "0.1.0", path = "../runtime", default-features = false }
serde_json = "1"
wasm-bindgen = "=0.2.129"
