[package]
name = "novar_accel"
description = "Novar: accelerator code generation (StableHLO for TPUs, PTX for NVIDIA GPUs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# PTX through LLVM's NVPTX backend (needs LLVM installed; see scripts/llvm-env.sh).
llvm = ["dep:inkwell"]

[dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1-prefer-dynamic", "target-nvptx"], optional = true }
novar_diagnostics = { version = "0.0.2", path = "../diagnostics" }
novar_hir = { version = "0.0.2", path = "../semantic" }

[dev-dependencies]
novar_parser = { version = "0.0.2", path = "../parser" }
