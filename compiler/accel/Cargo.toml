[package]
name = "telvax_accel"
description = "Telvax: accelerator code generation (StableHLO for TPUs, PTX for NVIDIA GPUs)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# PTX through LLVM's NVPTX backend (needs LLVM installed; see scripts/llvm-env.sh).
llvm = ["dep:inkwell"]

[dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1-prefer-dynamic", "target-nvptx"], optional = true }
telvax_diagnostics = { path = "../diagnostics" }
telvax_hir = { path = "../semantic" }

[dev-dependencies]
telvax_parser = { path = "../parser" }
