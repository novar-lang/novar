[package]
name = "telvax_mlir"
description = "Telvax: telvax_mlir"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Native backend through MLIR/LLVM 22 (needs LLVM installed; see scripts/llvm-env.sh).
llvm = ["dep:melior", "dep:telvax_hir"]

[dependencies]
melior = { version = "0.27", optional = true }
telvax_diagnostics = { version = "0.0.4", path = "../diagnostics" }
telvax_hir = { version = "0.0.4", path = "../semantic", optional = true }

[dev-dependencies]
telvax_parser = { version = "0.0.4", path = "../parser" }
telvax_runtime = { version = "0.0.4", path = "../../runtime" }
