[package]
name = "telvax_codegen"
description = "Telvax: telvax_codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Object/executable generation through LLVM 22 (needs LLVM installed; see scripts/llvm-env.sh).
llvm = ["dep:telvax_hir", "dep:telvax_diagnostics", "dep:telvax_mlir", "telvax_mlir/llvm", "dep:inkwell", "dep:melior", "dep:mlir-sys", "dep:libc"]

[dependencies]
inkwell = { version = "0.10", default-features = false, features = ["llvm22-1-prefer-dynamic", "target-x86", "target-aarch64"], optional = true }
libc = { version = "0.2", optional = true }
melior = { version = "0.27", optional = true }
mlir-sys = { version = "220", optional = true }
telvax_diagnostics = { version = "0.0.4", path = "../diagnostics", optional = true }
telvax_hir = { version = "0.0.4", path = "../semantic", optional = true }
telvax_mlir = { version = "0.0.4", path = "../ir", optional = true }

[dev-dependencies]
telvax_parser = { version = "0.0.4", path = "../parser" }
telvax_runtime = { version = "0.0.4", path = "../../runtime" }
