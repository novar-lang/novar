[package]
name = "telvax_modules"
description = "Telvax: multi-file programs, module imports and package dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
telvax_ast = { path = "../ast" }
telvax_diagnostics = { path = "../diagnostics" }
telvax_parser = { path = "../parser" }
serde = { version = "1.0.229", features = ["derive"] }

[dev-dependencies]
telvax_hir = { path = "../semantic" }
telvax_runtime = { path = "../../runtime", default-features = false }
