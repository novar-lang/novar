name: Integration

# Parts of the project that need more than `cargo test`: the Python bindings, the WebAssembly
# playground, the VS Code extension and a real PostgreSQL with pgvector. None of these are
# required checks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: python
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build and install the extension
        run: python -m venv .venv && . .venv/bin/activate && pip install maturin numpy pyarrow polars pytest ray && pip install torch --index-url https://download.pytorch.org/whl/cpu && cd python && maturin develop
      - name: Test
        run: . .venv/bin/activate && cd python && python -m pytest tests -q

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: scripts/build-playground.sh --node
      - run: node --test playground/test/*.test.js

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
      - run: npm test
        working-directory: editors/vscode

  pgvector:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: telvax
          POSTGRES_DB: vectors
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Real pgvector round trip
        env:
          TELVAX_TEST_PG_URL: postgresql://postgres:telvax@localhost:5432/vectors
        run: cargo test -p telvax_runtime --test live pgvector -- --nocapture

  # Builds the Dockerfile that `telvax build --serve` writes and calls the container. The image
  # compiles Telvax from the branch under test (the default branch on pushes).
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -q -p telvax_cli
      - name: Generate the Dockerfile
        run: |
          mkdir app
          cp examples/rag-service.tvx app/
          target/debug/telvax build --serve app/rag-service.tvx -o app/service --dockerfile
      - run: docker build --build-arg TELVAX_REF="${{ github.head_ref || 'main' }}" -t telvax-rag app
      - name: Call the container
        run: |
          docker run -d --name rag -p 8080:8080 telvax-rag
          for i in $(seq 1 30); do
            curl -fsS -XPOST localhost:8080/v1/rag/query -H 'content-type: application/json' \
              -d '{"query":"hello","top_k":3}' && exit 0
            sleep 1
          done
          docker logs rag
          exit 1

  # Opens the playground page in a real Chromium and runs programs in it.
  playground-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: scripts/build-playground.sh
      - run: npm ci
        working-directory: playground/e2e
      - run: npx playwright install --with-deps chromium
        working-directory: playground/e2e
      - run: npm test
        working-directory: playground/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playground-traces
          path: playground/e2e/test-results

  # Installs the extension in a real VS Code (downloaded by @vscode/test-electron) and drives it
  # against the real language server.
  vscode-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      # The language server does not need tables or SQL, so the small build is enough.
      - run: cargo build -p telvax_cli --no-default-features --features live
      - run: npm ci
        working-directory: editors/vscode
      - run: npm run compile
        working-directory: editors/vscode
      - run: xvfb-run -a npm run test:vscode
        working-directory: editors/vscode
        env:
          TELVAX_BIN: ${{ github.workspace }}/target/debug/telvax
