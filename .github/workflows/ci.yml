name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - name: Examples are formatted
        run: cargo run -q -p novar_cli -- fmt --check examples/rag-service.nv examples/basics/primes.nv examples/basics/sieve.nv examples/hello-world/hello.nv examples/dataframe/sales.nv

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Native backend (MLIR + LLVM 22) and the PTX generator: tests and lints with the `llvm` feature.
  llvm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM 22 with MLIR
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y llvm-22-dev libmlir-22-dev mlir-22-tools libzstd-dev libpolly-22-dev
      - run: . scripts/llvm-env.sh && cargo clippy --workspace --all-targets --features llvm
      - run: . scripts/llvm-env.sh && cargo test --workspace --features llvm

  # The GPU backend compiles everywhere; running its tests needs a GPU adapter, which hosted
  # runners do not have, so this job only builds and lints it.
  gpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p novar_runtime -p novar_cli --features novar_cli/gpu --all-targets
      - run: cargo test -p novar_runtime --features gpu --no-run

  # Windows runs the same tests as Linux.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The ~10 MB build without Arrow / DataFusion must keep compiling and passing its tests.
  lite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p novar_cli --no-default-features --features live

  # The same tests as Linux and Windows, on macOS (Apple silicon). The runners have no GPU, so
  # the GPU tests do not run here either.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Line coverage of the Rust workspace. The number goes to the job summary, and the job fails when
  # it drops below the floor in scripts/coverage-floor.txt.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --workspace --json --summary-only --output-path coverage.json
      - run: python3 scripts/coverage-gate.py coverage.json

  # Speed and memory gates: the RAG service must keep its overhead and footprint inside the alpha
  # targets (p99 under 15 ms, RSS under 30 MB) and the interpreter must not get much slower.
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p novar_cli --no-default-features --features live
      - run: cargo build --release -p novar_bench
      # Shared runners are noisy: one retry before calling it a regression.
      - name: RAG overhead and memory
        run: |
          target/release/rag_latency target/release/novar --docs 2000 --check ||
            target/release/rag_latency target/release/novar --docs 2000 --check
      - name: Interpreter speed
        run: benchmarks/speed.sh target/release/novar
