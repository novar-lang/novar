name: Update pull requests

# The branch protection wants a pull request to be up to date with main before it can merge. After
# every push to main this brings the open pull requests that have auto-merge turned on up to date, so
# they keep going without anyone pressing "Update branch". It uses AUTO_MERGE_TOKEN because an
# update made with GITHUB_TOKEN would not start the checks again.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-branches
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.AUTO_MERGE_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Update the branches that fell behind
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "AUTO_MERGE_TOKEN is not set, nothing to do"
            exit 0
          fi
          # Give GitHub a moment to recompute which pull requests are behind.
          sleep 20
          gh pr list --state open --json number,autoMergeRequest,mergeStateStatus,isDraft \
            --jq '.[] | select(.autoMergeRequest != null and .isDraft == false and .mergeStateStatus == "BEHIND") | .number' |
          while read -r number; do
            echo "updating #$number"
            gh pr update-branch "$number" || echo "could not update #$number (conflicts?)"
          done
