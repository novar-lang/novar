name: Release

# A push to main that raises `version` in the root Cargo.toml tags the commit `v<version>` and
# publishes a release with binaries. Pushing a `v*` tag by hand (or running the workflow) does the
# same for that tag.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      publish: ${{ steps.tag.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p}' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "no workspace version found" >&2; exit 1; }
          tag="v$version"
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$tag" -m "Novar $version"
            git push origin "$tag"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # Not exercised on a real Windows machine yet: a failure here must not block the release.
          - { os: windows-latest, target: x86_64-pc-windows-msvc, experimental: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      # Full build: SQL (DataFusion), Parquet and real services (about 50 MB).
      - run: cargo build --profile dist --locked -p novar_cli -p novar_pkg
      # Lite build: no DataFusion or Parquet, so no SQL; tables, CSV and real services stay (about 10 MB).
      - run: >
          cargo build --release --locked -p novar_cli --no-default-features --features live
          --target-dir target/lite
      - name: Package
        run: |
          mkdir dist-full dist-lite
          ext=""; if [ "${{ runner.os }}" = Windows ]; then ext=".exe"; fi
          cp target/dist/novar$ext target/dist/nvpm$ext dist-full/
          cp target/lite/release/novar$ext target/dist/nvpm$ext dist-lite/
          for variant in full lite; do
            name=novar-${{ matrix.target }}
            [ $variant = lite ] && name=novar-lite-${{ matrix.target }}
            if [ "${{ runner.os }}" = Windows ]; then
              (cd dist-$variant && 7z a -tzip ../$name.zip novar.exe nvpm.exe)
              sha256sum $name.zip > $name.zip.sha256
            else
              tar -czf $name.tar.gz -C dist-$variant novar nvpm
              shasum -a 256 $name.tar.gz > $name.tar.gz.sha256
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: novar-${{ matrix.target }}
          path: |
            novar-*${{ matrix.target }}.tar.gz*
            novar-*${{ matrix.target }}.zip*

  publish:
    needs: [plan, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from the changelog
        run: |
          version="${{ needs.plan.outputs.tag }}"
          version="${version#v}"
          awk -v v="$version" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $version" > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.plan.outputs.tag }}
          files: dist/*
          body_path: notes.md
          prerelease: true

  # Installs the release that was just published with the install scripts, on every system we ship
  # for, and runs the binaries: a smoke test of what users will actually download.
  verify:
    needs: [plan, publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, variant: full }
          - { os: ubuntu-latest, variant: lite }
          - { os: ubuntu-24.04-arm, variant: full }
          - { os: macos-latest, variant: full }
          - { os: macos-latest, variant: lite }
          - { os: macos-15-intel, variant: full }
          - { os: windows-latest, variant: full }
          - { os: windows-latest, variant: lite }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - name: Install with the script
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          version="${TAG#v}"
          export NOVAR_HOME="$RUNNER_TEMP/novar-home"
          [ "${{ matrix.variant }}" = lite ] && export NOVAR_LITE=1
          if [ "${{ runner.os }}" = Windows ]; then
            NOVAR_VERSION="$version" powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install.ps1
          else
            sh scripts/install.sh "$version"
          fi
          echo "$NOVAR_HOME/bin" >> "$GITHUB_PATH"
      - name: Version
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          out="$(novar --version)"
          echo "$out"
          [ "$out" = "novar ${TAG#v}" ]
          nvpm --help | head -n 3
      - name: Check, run and format
        run: |
          novar check examples/rag-service.nv
          novar run examples/basics/primes.nv main
          novar fmt --check examples/basics/primes.nv
          novar lint examples/basics/primes.nv
      - name: Serve the RAG example
        run: |
          novar serve examples/rag-service.nv --port 18080 > serve.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 30); do
            if curl -fsS -XPOST localhost:18080/v1/rag/query -H 'content-type: application/json' \
                 -d '{"query":"hello","top_k":3}' > reply.json 2>/dev/null; then ok=yes; break; fi
            sleep 1
          done
          kill $pid || true
          cat reply.json || true
          [ -n "$ok" ] || { cat serve.log; exit 1; }
          grep -q '"answer"' reply.json
      - name: Tables and CSV work everywhere; SQL and Parquet only in the full build
        run: |
          cat > tables.nv <<'NV'
          struct Row { id: i64, score: f32 }
          fn count() -> u64 { let t: Table<Row> = std::table::from_rows([Row { id: 1, score: 0.5 }]); t.len() }
          fn query() -> u64 {
              let t: Table<Row> = std::table::from_rows([Row { id: 1, score: 0.5 }]);
              let u: Table<Row> = t.sql("SELECT * FROM t");
              u.len()
          }
          NV
          [ "$(novar run tables.nv count)" = 1 ]
          if [ "${{ matrix.variant }}" = full ]; then
            [ "$(novar run tables.nv query)" = 1 ]
          else
            ! novar run tables.nv query 2> err.txt
            grep -q "not available in this build" err.txt
          fi
