version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: cargo
    directory: /python
    schedule:
      interval: weekly
    groups:
      python-crate-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /python
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    groups:
      vscode-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
