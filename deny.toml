[advisories]
yanked = "deny"
# `paste` is only reported as unmaintained (not vulnerable); it comes in through wgpu's Metal backend.
ignore = ["RUSTSEC-2024-0436"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "CDLA-Permissive-2.0", "Unicode-DFS-2016", "BSL-1.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version, so a release only changes the workspace version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
