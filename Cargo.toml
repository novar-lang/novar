[workspace]
resolver = "3"
exclude = ["python"]
members = [
    "compiler/lexer",
    "compiler/parser",
    "compiler/ast",
    "compiler/diagnostics",
    "compiler/modules",
    "compiler/semantic",
    "compiler/ir",
    "compiler/codegen",
    "compiler/accel",
    "runtime",
    "server",
    "cli",
    "benchmarks",
    "tools/lsp",
    "tools/formatter",
    "tools/linter",
    "tools/cluster",
    "tools/package-manager",
    "playground",
]

[workspace.package]
version = "0.0.4"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/novar-lang/novar"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

# Debug info made `target/debug` grow past 40 GB (Arrow, DataFusion and LLVM are large and every
# integration test is its own binary). Line tables keep backtraces readable at a fraction of the size.
[profile.dev]
debug = "line-tables-only"

# Release binaries are built with `--profile dist`: full LTO takes more than twice as long as thin
# LTO to link and makes the binary about 11% smaller.
[profile.dist]
inherits = "release"
lto = "fat"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
