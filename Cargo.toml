[workspace]
resolver = "3"
exclude = ["python"]
members = [
    "compiler/lexer",
    "compiler/parser",
    "compiler/ast",
    "compiler/diagnostics",
    "compiler/modules",
    "compiler/semantic",
    "compiler/ir",
    "compiler/codegen",
    "runtime",
    "server",
    "cli",
    "benchmarks",
    "tools/lsp",
    "tools/package-manager",
    "playground",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ntsation/novar"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
