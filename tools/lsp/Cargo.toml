[package]
name = "telvax_lsp"
description = "Telvax: language server (diagnostics, hover, completion, go to definition, inlay hints)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "telvax_lsp"

[[bin]]
name = "telvax-lsp"
path = "src/main.rs"

[features]
default = ["project"]
# Find a project's installed dependencies through `telvax.toml` (needs the package manager, which
# pulls in an HTTP client: off for the WebAssembly build).
project = ["dep:telvax_pkg"]

[dependencies]
lsp-server = "0.10"
lsp-types = "0.97"
telvax_fmt = { version = "0.0.4", path = "../formatter" }
telvax_diagnostics = { version = "0.0.4", path = "../../compiler/diagnostics" }
telvax_hir = { version = "0.0.4", path = "../../compiler/semantic" }
telvax_modules = { version = "0.0.4", path = "../../compiler/modules" }
telvax_parser = { version = "0.0.4", path = "../../compiler/parser" }
telvax_pkg = { version = "0.0.4", path = "../package-manager", optional = true }
serde = "1"
serde_json = "1"
