[package]
name = "novar_lsp"
description = "Novar: language server (diagnostics, hover, completion, go to definition, inlay hints)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "novar_lsp"

[[bin]]
name = "novar-lsp"
path = "src/main.rs"

[features]
default = ["project"]
# Find a project's installed dependencies through `novar.toml` (needs the package manager, which
# pulls in an HTTP client: off for the WebAssembly build).
project = ["dep:novar_pkg"]

[dependencies]
lsp-server = "0.7"
lsp-types = "0.97"
novar_fmt = { version = "0.0.2", path = "../formatter" }
novar_diagnostics = { version = "0.0.2", path = "../../compiler/diagnostics" }
novar_hir = { version = "0.0.2", path = "../../compiler/semantic" }
novar_modules = { version = "0.0.2", path = "../../compiler/modules" }
novar_parser = { version = "0.0.2", path = "../../compiler/parser" }
novar_pkg = { version = "0.0.2", path = "../package-manager", optional = true }
serde = "1"
serde_json = "1"
