[package]
name = "telvax_pkg"
description = "Telvax: tvpm, the package manager (manifests, lockfiles, version resolution, registries)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "telvax_pkg"

[[bin]]
name = "tvpm"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.10"
telvax_hir = { path = "../../compiler/semantic" }
telvax_modules = { path = "../../compiler/modules" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = "0.4.46"
toml = "1.1.8"
ureq = "3"

[dev-dependencies]
telvax_ast = { path = "../../compiler/ast" }
telvax_parser = { path = "../../compiler/parser" }
telvax_runtime = { path = "../../runtime", default-features = false }
