[package]
name = "novar_pkg"
description = "Novar: nvpm, the package manager (manifests, lockfiles, version resolution, registries)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[lib]
name = "novar_pkg"

[[bin]]
name = "nvpm"
path = "src/main.rs"

[dependencies]
flate2 = "1.1.10"
novar_modules = { version = "0.0.1", path = "../../compiler/modules" }
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
tar = "0.4.46"
toml = "1.1.8"
ureq = "3"

[dev-dependencies]
novar_ast = { version = "0.0.1", path = "../../compiler/ast" }
novar_hir = { version = "0.0.1", path = "../../compiler/semantic" }
novar_runtime = { version = "0.0.1", path = "../../runtime", default-features = false }
