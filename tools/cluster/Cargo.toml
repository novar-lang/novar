[package]
name = "novar_cluster"
description = "Novar: distributed execution (workers, a coordinator with retries) behind std::dist::map"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8"
novar_hir = { version = "0.0.2", path = "../../compiler/semantic" }
novar_modules = { version = "0.0.2", path = "../../compiler/modules" }
novar_runtime = { version = "0.0.2", path = "../../runtime" }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
ureq = { version = "3", features = ["json"] }
