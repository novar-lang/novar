[package]
name = "telvax_cluster"
description = "Telvax: distributed execution (workers, a coordinator with retries) behind std::dist::map"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
axum = "0.8"
telvax_hir = { path = "../../compiler/semantic" }
telvax_modules = { path = "../../compiler/modules" }
telvax_runtime = { path = "../../runtime", default-features = false }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "signal"] }
ureq = { version = "3", features = ["json"] }
